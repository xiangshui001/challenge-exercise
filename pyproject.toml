[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge-exp5"
version = "0.1.0"
description = "Flickr30K retrieval evaluation and introductory SigLIP finetuning, experiment five"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
models = ["torch==2.8.0", "transformers==4.57.3", "sentencepiece>=0.2,<0.3", "protobuf>=4,<7"]
test = ["scikit-learn>=1.3,<2"]

[project.scripts]
exp5 = "exp5.cli:main"

[tool.setuptools.packages.find]
include = ["exp5*", "models*"]
